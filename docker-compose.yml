services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mra-meeting-backend
    restart: unless-stopped
    network_mode: host
    env_file:
      - ./backend/.env
    environment:
      - PORT=5007
      - NODE_ENV=production

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=/api
    container_name: mra-meeting-frontend
    restart: unless-stopped
    network_mode: host
    environment:
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: mra-meeting-proxy
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
